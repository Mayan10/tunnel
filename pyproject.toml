[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel"
version = "0.3.0"
description = "A terminal app for ordering Apple Music playlists into smooth listening flows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tunnel contributors" }]
license = { text = "MIT" }
dependencies = []
keywords = ["apple-music", "playlist", "cli", "terminal", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/Mayan10/tunnel"
Repository = "https://github.com/Mayan10/tunnel"
Issues = "https://github.com/Mayan10/tunnel/issues"
Changelog = "https://github.com/Mayan10/tunnel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]
ml = ["coremltools>=7.0", "numpy>=1.23"]

[project.scripts]
tunnel = "tunnel.cli:main"

[tool.setuptools.packages.find]
include = ["tunnel*"]

[tool.setuptools.package-data]
tunnel = ["*.json", "models/*.mlmodel"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["tunnel"]
ignore_missing_imports = true
warn_unused_ignores = true
