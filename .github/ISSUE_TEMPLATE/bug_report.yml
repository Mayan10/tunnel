name: Bug report
description: Report a problem with Tunnel
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Tunnel version
      description: Output of `tunnel --version`
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact command you ran and the full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
