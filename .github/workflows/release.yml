name: release

on:
  release:
    types: [published]

jobs:
  build-zipapp:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build zipapp
        run: python scripts/build_zipapp.py
      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tunnel.pyz
