name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to upload tunnel.pyz to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-zipapp:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build zipapp
        run: python scripts/build_zipapp.py
      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
          files: dist/tunnel.pyz
