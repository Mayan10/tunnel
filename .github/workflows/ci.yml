name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: pip install .[dev]
      - name: Ruff
        run: ruff check .

  typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: pip install .[dev]
      - name: Mypy
        run: mypy tunnel

  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install .
      - name: Run tests, including the Core ML embedding model
        run: python -m unittest -v

  build:
    needs: [lint, typecheck, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependency
        run: pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify the wheel installs and runs
        run: |
          python -m venv /tmp/verify-wheel
          /tmp/verify-wheel/bin/pip install dist/*.whl
          /tmp/verify-wheel/bin/tunnel --version
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-dist
          path: dist/*
